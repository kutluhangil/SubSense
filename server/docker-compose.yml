# Aboneyim — macmini-server Production Docker Compose (Frontend + Backend API)
# Çalışacağı makine: Mac (kutluhangil@Kutluhans-Mac-Mini) üzerinden uzak context ile:
#   docker --context macmini compose -f server/docker-compose.yml --env-file .env up -d --build
# Port kuralı: ASLA 0.0.0.0'a açılmaz; aboneyim_api dışarıya hiç port açmaz (yalnız iç ağda :4000),
#              aboneyim_web ise yalnızca sunucu içi 127.0.0.1:3002'de dinler.

services:
  aboneyim_api:
    build:
      context: ..
      dockerfile: functions/Dockerfile
    image: aboneyim_api:latest
    container_name: aboneyim_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-subscriptionhub-85b02}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Aboneyim <onboarding@resend.dev>}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON:-}
      APP_URL: ${APP_URL:-https://macmini-server.taild883a6.ts.net}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  aboneyim:
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    image: aboneyim:latest
    container_name: aboneyim_web
    restart: unless-stopped
    depends_on:
      aboneyim_api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3002:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

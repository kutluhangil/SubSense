" style="animation:tw 2.6s ease-in-out 0.9s infinite"/><circle cx="1025.2" cy="173" r="1.4" fill="#fff" style="animation:tw 2.7s ease-in-out 1.2s infinite"/><circle cx="935.1" cy="136.6" r="0.6" fill="#fff" style="animation:tw 3.7s ease-in-out 1.9s infinite"/><circle cx="1034.5" cy="273.9" r="1.1" fill="#fff" style="animation:tw 3.9s ease-in-out 1.8s infinite"/><circle cx="923.9" cy="234.4" r="1.9" fill="#fff" style="animation:tw 1.7s ease-in-out 1.8s infinite"/><circle cx="941" cy="216.5" r="1.5" fill="#fff" style="animation:tw 2.5s ease-in-out 1.1s infinite"/><circle cx="1019" cy="211.4" r="1.4" fill="#fff" style="animation:tw 2s ease-in-out 1.3s infinite"/></g>

<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SubSense</title>
  <meta name="description"
    content="The local-first subscription tracker. Manage global expenses, compare prices worldwide, and optimize your spending with Gemini AI. Privacy-focused and free." />
  <meta name="keywords"
    content="subscription tracker, expense manager, recurring payments, netflix price comparison, spotify stats, local-first app" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="%APP_URL%" />
  <meta property="og:title" content="SubSense" />
  <meta property="og:description"
    content="Track, manage, and optimize your global subscriptions. Compare prices worldwide and save money with SubSense." />
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=1200" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="%APP_URL%" />
  <meta property="twitter:title" content="SubSense" />
  <meta property="twitter:description"
    content="Track, manage, and optimize your global subscriptions. Privacy-focused and powered by Gemini AI." />
  <meta property="twitter:image"
    content="https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&q=80&w=1200" />

  <meta name="theme-color" content="#ffffff" />
  <link rel="canonical" href="%APP_URL%" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />

  <script>
    window.onerror = (msg, src, line, col, err) => {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
          <div style="font-family:monospace;padding:24px;background:#1a1a1a;color:#ff6b6b;min-height:100vh">
            <h2 style="color:#ff4444">⛔ SubSense Load Error</h2>
            <p><strong>${msg}</strong></p>
            <p>Source: ${src} | Line: ${line}:${col}</p>
            <pre style="white-space:pre-wrap;font-size:12px;color:#ffa">${err?.stack || 'No stack trace'}</pre>
          </div>`;
      }
      return false;
    };
    window.addEventListener('unhandledrejection', (event) => {
      const root = document.getElementById('root');
      if (root) {
        root.innerHTML = `
          <div style="font-family:monospace;padding:24px;background:#1a1a1a;color:#ff6b6b;min-height:100vh">
            <h2 style="color:#ff4444">⛔ SubSense Unhandled Rejection</h2>
            <pre style="white-space:pre-wrap;font-size:12px;color:#ffa">${String(event.reason?.stack || event.reason)}</pre>
          </div>`;
      }
    });
  </script>
  <script type="module" src="/index.tsx"></script>
</head>

<body>
  <div id="root"></div>
</body>

</html>
